name: Deploy frontend to GitHub Pages

# Builds the Next.js static export in frontend/ and publishes it to GitHub Pages.
# Configure once: repo Settings → Pages → Source = "GitHub Actions", and add a
# repo *Variable* NEXT_PUBLIC_API_BASE_URL = your Render backend URL
# (e.g. https://ask-greece-backend.onrender.com, no trailing slash).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build static export
        env:
          # Backend API the static site calls at runtime (set as a repo Variable).
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          # Project Pages serve under /<repo>/ — derive the base path from the repo name.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Ensure .nojekyll (serve _next/ assets)
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
