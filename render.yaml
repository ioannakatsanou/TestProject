# Render Blueprint — one-click backend + managed PostgreSQL.
# In Render: New → Blueprint → point at this repo. Frontend is deployed
# separately on Vercel (see README).
services:
  - type: web
    name: ask-greece-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: ask-greece-db
          property: connectionString
      # Set after the Vercel frontend exists (your Vercel URL, no trailing slash)
      - key: ALLOWED_ORIGINS
        sync: false
      # Leave unset to keep mock mode; set to enable real Claude answers
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-haiku-4-5

databases:
  - name: ask-greece-db
    plan: free
